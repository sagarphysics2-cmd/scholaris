name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: scholaris
          POSTGRES_PASSWORD: scholaris
          POSTGRES_DB: scholaris
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U scholaris" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://scholaris:scholaris@localhost:5432/scholaris
      TEST_DATABASE_URL: postgresql://scholaris:scholaris@localhost:5432/scholaris_test
      APP_URL: http://localhost:3100
      SEED_DEMO_PASSWORD: Scholaris!2026
      CRON_SECRET: ci-cron-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --legacy-peer-deps
      - run: psql postgresql://scholaris:scholaris@localhost:5432/scholaris -c "CREATE DATABASE scholaris_test"
      - run: npx prisma generate
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Build
        run: npx prisma migrate deploy && npm run db:seed && npm run build
      - name: End-to-end tests
        run: npx playwright install --with-deps chromium && npm run test:e2e
